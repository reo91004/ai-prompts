##### 기본 사용성 #####

# 마우스 클릭, 창 선택, 휠 스크롤 활성화
set -g mouse on

# 스크롤 로그 보관량
# 너무 크게 잡으면 pane이 많을 때 메모리를 소비하므로 5만 줄로 제한
set -g history-limit 50000

# Esc 및 Vim/터미널 입력 지연 감소
set -sg escape-time 10

# 새 창과 pane 번호를 1부터 시작
set -g base-index 1
setw -g pane-base-index 1

# 창을 닫으면 번호를 자동으로 다시 정렬
set -g renumber-windows on

# Vim, Neovim 등의 터미널 focus event 지원
set -g focus-events on

##### 색상 및 터미널 #####

# truecolor 출력. tmux-256color terminfo가 시스템에 있어야 한다
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# allow-passthrough는 설정하지 않는다. tmux 3.2a에는 이 옵션이 없어 설정 오류 화면이 먼저 뜨고,
# 켜면 셸이 보내는 제어 시퀀스가 Warp UI를 활성화해 tmux 입력 포커스를 빼앗는다. 3.3 이상의 기본값은 off다.

##### 복사 모드와 클립보드 #####

set -g mode-keys vi

# OSC 52로 시스템 클립보드 연동. 터미널 쪽 지원이 필요하다
set -g set-clipboard on

# copy-mode에서 Vim처럼 v로 선택 시작, y로 복사
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 휠 스크롤 속도를 기본 틱당 5줄에서 3줄로 감속
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 3 scroll-down

##### 세션 운용 #####

# 붙어 있던 세션이 사라져도 디태치되지 않고 남은 세션으로 이동
set -g detach-on-destroy off

# 상태줄 메시지와 pane 번호 표시 시간 (기본 750ms는 너무 짧다)
set -g display-time 2000
set -g display-panes-time 2000

# 커맨드 프롬프트 입력 기록 유지
set -g history-file ~/.tmux_history

# 상태줄 갱신 주기
set -g status-interval 5

##### 단축키 #####

# Ctrl+b, r : 설정 파일 다시 불러오기
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Ctrl+b, | : 현재 경로에서 좌우 분할
bind | split-window -h -c "#{pane_current_path}"

# Ctrl+b, - : 현재 경로에서 위아래 분할
bind - split-window -v -c "#{pane_current_path}"

# Ctrl+b, c : 현재 경로에서 새 창 생성
bind c new-window -c "#{pane_current_path}"
